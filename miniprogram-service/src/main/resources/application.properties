spring.application.name=miniprogram-service
server.port=8087

spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.config.import-check.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/emergency_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=false
