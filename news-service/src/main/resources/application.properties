# Nacos帮助文档: https://nacos.io/zh-cn/docs/concepts.html
spring.application.name=news-service
# Nacos认证信息
spring.cloud.nacos.discovery.username=nacos
spring.cloud.nacos.discovery.password=nacos
# Nacos 服务发现与注册配置
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.namespace=public

# 【重点修复】临时关掉 Nacos 自动注册，避免本地测试因连不上云端 Nacos 导致启动失败
spring.cloud.nacos.discovery.enabled=true

# 应用服务 WEB 访问端口
server.port=8082

# 数据库配置 (从 db-migration 参考而来)
spring.datasource.url=jdbc:mysql://localhost:3306/emergency_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 与 Hibernate 配置
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 本模块关闭 Flyway 自动执行（由特定的 db-migration 模块统一管理）
spring.flyway.enabled=false
