spring:
  application:
    name: db-migration-service

  datasource:
    url: jdbc:mysql://localhost:3306/emergency_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: false        # 首次运行建议 false；若已有表需迁移再设为 true
    locations: classpath:db/migration # 默认值，可省略
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true              # 禁止 flyway clean（生产环境必须开启）