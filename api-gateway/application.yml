server:
  port: 8080  # 网关对外端口

spring:
  application:
    name: gateway-service

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848  # Nacos 地址

    gateway:
      discovery:
        locator:
          enabled: true               # 开启服务发现路由（根据服务名自动路由）
          lower-case-service-id: true # 服务ID转小写

      routes:
        # 小程序端
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
            - Path=/api/reported-incidents/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
            - Path=/api/messages/**
          filters:
            - StripPrefix=1

        - id: news-service
          uri: lb://news-service
          predicates:
            - Path=/api/news/**
            - Path=/api/admin/news/**
          filters:
            - StripPrefix=1   # 对 /api/news；对 /api/admin/news 可能需更细控制

        - id: material-service
          uri: lb://material-service
          predicates:
            - Path=/api/materials/**
          filters:
            - StripPrefix=1

        - id: cbr-service
          uri: lb://cbr-service
          predicates:
            - Path=/api/emergency-events/**   # 根据你文档中的 AI 决策接口
          filters:
            - StripPrefix=1

        # 管理端员工登录（若 auth-service 处理）
        - id: worker-auth
          uri: lb://auth-service
          predicates:
            - Path=/api/worker/**
          filters:
            - StripPrefix=1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG  # 调试时开启，上线关闭